<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/data.js"></script>
  <script src="js/ranks-icons.js"></script>
</head>
<body>
  <script>renderNavbar("reports.html"); applyBackground();</script>

  <div class="container">
    <div class="mb-6">
      <h1 style="font-size:1.45rem;">Operational Reports</h1>
      <p class="text-muted text-sm">Rank-restricted. Your clearance: <span id="my-rank" style="font-weight:600;"></span></p>
    </div>
    <div id="list"></div>
  </div>

  <script>
    const session = requireAuth();
    if (!session) throw new Error("redirect");

    document.getElementById("my-rank").innerHTML = formatRank(session.rank_level, 18);
    document.getElementById("my-rank").className = "rank-" + session.rank_level;

    const reports = getReports()
      .filter(r => r.status === "published")
      .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    const list = document.getElementById("list");

    if (reports.length === 0) {
      list.innerHTML = `<div class="panel text-center" style="padding:3rem;"><p class="text-muted">No published reports yet.</p></div>`;
    } else {
      list.innerHTML = reports.map(r => {
        const hasAccess = canAccess(session.rank_level, r.min_rank_level);
        const date = new Date(r.created_at).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
        return `
          <a href="${hasAccess ? 'report.html?id='+r.id : '#'}"
             class="panel mb-4" style="display:block; ${hasAccess ? '' : 'opacity:0.5;cursor:not-allowed;'}">
            <div class="flex justify-between items-center" style="gap:1rem;">
              <div style="flex:1;min-width:0;">
                <div class="flex items-center gap-2" style="flex-wrap:wrap;margin-bottom:0.3rem;">
                  <strong>${esc(r.title)}</strong>
                  ${r.is_classified ? '<span class="badge badge-classified">CLASSIFIED</span>' : ''}
                  <span class="badge badge-rank rank-${r.min_rank_level}">${typeof rankIcon==="function"?rankIcon(r.min_rank_level,16):""} ${getRankName(r.min_rank_level)}+</span>
                </div>
                ${r.summary ? `<p class="text-sm text-muted">${esc(r.summary)}</p>` : ''}
                <div class="text-xs text-muted mt-2">${esc(r.author_name || "Unknown")} • ${date}</div>
              </div>
              ${!hasAccess ? '<span style="color:var(--warning);font-size:1.2rem;">🔒</span>' : ''}
            </div>
          </a>`;
      }).join("");
    }

    function esc(s) {
      if (!s) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
