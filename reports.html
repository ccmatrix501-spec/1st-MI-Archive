<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ranks-icons.js"></script>
</head>
<body>
  <div id="app"><p class="text-muted text-center" style="padding:3rem;">Loading…</p></div>
  <script>
    function buildNav(session, companies, active) {
      var isAdmin = session.role === "admin";
      var links = [["dashboard.html","Dashboard"],["reports.html","Reports"],["voting.html","Voting"],["training.html","Training"],["tutorials.html","Tutorials"],["tactical-centre.html","Tactical Centre"],["profile.html","Profile"]];
      if (isAdmin) { links.push(["merits.html","Merits"]); links.push(["admin.html","Admin"]); }
      var h = '<nav class="navbar"><div class="nav-inner"><div class="nav-brand"><span>◆</span> TACTICAL ARCHIVE</div><div class="nav-links">';
      links.forEach(function(pair) {
        var gold = (pair[1]==="Admin"||pair[1]==="Merits") ? "color:#fbbf24" : "";
        h += '<a href="'+pair[0]+'" class="'+(pair[0]===active?"active":"")+'" style="'+gold+'">'+pair[1]+'</a>';
      });
      h += '</div><div class="nav-user"><div><div style="font-weight:600">'+esc(session.username)+'</div><div class="text-xs text-muted">'+formatRank(session.rank_level)+' · '+esc(companyName(companies||[], session.company_id))+'</div></div><button class="btn-logout" onclick="logout()">Logout</button></div></div></nav>';
      return h;
    }
    
    (async function() {
      initSupabase();
      var session = await requireAuth();
      if (!session) return;
      await applyBackground(); showVersion();
      var companies = await getCompanies();
      var reports = (await getReports()).filter(function(r){ return canSeeReport(r, session); });
      var html = buildNav(session, companies, "reports.html");
      html += '<div class="container"><div class="mb-6"><h1 style="font-size:1.45rem;">Reports</h1>';
      html += '<p class="text-muted text-sm">Your rank: '+formatRank(session.rank_level,18)+' · must match rank + company, or be tagged — applies to everyone including admins</p></div>';
      if (!reports.length) html += '<div class="panel text-center" style="padding:3rem;"><p class="text-muted">No reports available for your rank/company.</p></div>';
      else reports.forEach(function(r) {
        html += '<a href="report.html?id='+encodeURIComponent(r.id)+'" class="card mb-4" style="display:block;text-decoration:none;color:inherit;">';
        html += '<div class="flex justify-between" style="flex-wrap:wrap;gap:0.5rem;"><strong>'+esc(r.title)+'</strong>';
        html += '<span class="badge">'+formatRank(r.min_rank_level,14)+'+</span></div>';
        html += '<p class="text-sm text-muted mt-2">'+(r.is_classified?"CLASSIFIED · ":"")+esc(companyName(companies, r.company_id));
        html += ' · '+esc(r.author_name||"")+' · '+new Date(r.created_at).toLocaleDateString();
        if (r.attachments && r.attachments.length) html += ' · 📎 '+r.attachments.length+' file(s)';
        html += '</p></a>';
      });
      html += '</div>';
      document.getElementById("app").innerHTML = html;
    })();

  </script>
</body>
</html>
