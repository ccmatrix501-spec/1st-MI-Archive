<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css?v=s2" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=s2"></script>
  <script src="js/data.js?v=s2"></script>
  <script src="js/ranks-icons.js?v=s2"></script>
</head>
<body>
  <div id="app"><p class="text-muted text-center" style="padding:3rem;">Loading…</p></div>
  <script>
    let session = null;

    function tabs(active) {
      const items = [
        ["reports","Reports"],["merits","Merits"],["training","Training"],
        ["tutorials","Tutorials"],["links","Tactical Centre"],["users","Users"]
      ];
      return items.map(([id,label]) =>
        `<button class="btn btn-sm ${active===id?'':'btn-outline'} tab-btn" data-tab="${id}" style="margin:0.2rem;">${label}</button>`
      ).join("");
    }

    async function render(tab) {
      tab = tab || "reports";
      let html = '<nav class="navbar"><div class="nav-inner"><div class="nav-brand"><span>◆</span> TACTICAL ARCHIVE</div><div class="nav-links">';
      [["dashboard.html","Dashboard"],["reports.html","Reports"],["voting.html","Voting"],["training.html","Training"],["tutorials.html","Tutorials"],["tactical-centre.html","Tactical Centre"],["merits.html","Merits"],["admin.html","Admin"],["profile.html","Profile"]].forEach(([h,l]) => {
        html += '<a href="'+h+'" class="'+(h==="admin.html"?"active":"")+'" style="color:#fbbf24">'+l+'</a>';
      });
      html += '</div><div class="nav-user"><div><div style="font-weight:600">'+esc(session.username)+'</div><div>'+formatRank(session.rank_level)+' · admin</div></div><button class="btn-logout" onclick="logout()">Logout</button></div></div></nav>';
      html += '<div class="container"><h1 style="font-size:1.45rem;margin-bottom:1rem;">Admin Panel</h1>';
      html += '<div class="mb-4">'+tabs(tab)+'</div>';
      html += '<div id="tab-body"></div></div>';
      document.getElementById("app").innerHTML = html;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.onclick = () => render(btn.dataset.tab);
      });
      const body = document.getElementById("tab-body");
      if (tab === "users") await renderUsers(body);
      else if (tab === "reports") await renderReports(body);
      else if (tab === "merits") await renderMerits(body);
      else if (tab === "training") await renderTraining(body);
      else if (tab === "tutorials") await renderTutorials(body);
      else if (tab === "links") await renderLinks(body);
    }

    async function renderUsers(el) {
      const profiles = await getProfiles();
      const members = profiles.filter(p => p.role === "member").length;
      const admins = profiles.filter(p => p.role === "admin").length;
      let h = '<div class="panel mb-4"><h2 style="font-size:1.1rem;margin-bottom:0.5rem;">All Members</h2>';
      h += '<p class="text-sm text-muted mb-4">Total '+profiles.length+' · Members '+members+' · Admins '+admins+'</p>';
      profiles.forEach(p => {
        const isYou = p.id === session.id;
        h += '<div class="panel mb-2" style="padding:0.9rem;'+(isYou?'border-color:#3d7a3d;':'')+'">';
        h += '<div class="flex justify-between" style="flex-wrap:wrap;gap:0.5rem;"><div><strong>'+esc(p.username)+'</strong>'+(isYou?' <span class="badge">YOU</span>':'')+'<div class="text-xs text-muted">'+formatRank(p.rank_level,14)+' · '+p.role+'</div></div>';
        h += '<div class="flex gap-2" style="flex-wrap:wrap;align-items:end;">';
        h += '<div><div class="text-xs text-muted">Rank</div><select class="select" id="rank-'+p.id+'" style="width:auto;">'+rankOptions(p.rank_level)+'</select></div>';
        h += '<div><div class="text-xs text-muted">Role</div><select class="select" id="role-'+p.id+'" style="width:auto;"><option value="member"'+(p.role==='member'?' selected':'')+'>member</option><option value="moderator"'+(p.role==='moderator'?' selected':'')+'>moderator</option><option value="admin"'+(p.role==='admin'?' selected':'')+'>admin</option></select></div>';
        h += '<button class="btn btn-sm" onclick="saveUser(\''+p.id+'\')">Save</button>';
        h += '</div></div></div>';
      });
      h += '</div>';
      h += `<div class="panel mb-4">
        <h3 style="font-size:1rem;margin-bottom:0.8rem;">Create Member Account</h3>
        <p class="text-sm text-muted mb-3">Creates a Supabase auth user + profile. They log in with this email worldwide.</p>
        <div id="create-alert" class="hidden"></div>
        <form id="create-form">
          <div class="form-group"><label>Username (display)</label><input type="text" id="c-user" class="input" required minlength="3" /></div>
          <div class="form-group"><label>Password</label><input type="password" id="c-pass" class="input" required minlength="6" /></div>
          <div class="form-group"><label>Rank</label><select id="c-rank" class="select">'+rankOptions(1)+'</select></div>
          <div class="form-group"><label>Role</label><select id="c-role" class="select"><option value="member">member</option><option value="moderator">moderator</option><option value="admin">admin</option></select></div>
          <button type="submit" class="btn">Create Account</button>
        </form>
        <p class="text-xs text-muted mt-3">After creating, you may be signed out of admin — just log back in.</p>
      </div>`;
      // fix broken string - rewrite create form properly
      el.innerHTML = h.replace(`<select id="c-rank" class="select">'+rankOptions(1)+'</select>`, '<select id="c-rank" class="select">'+rankOptions(1)+'</select>');

      // Fix: the template got messy. Rebuild create section cleanly.
      const createHtml = `
        <div class="panel mb-4">
          <h3 style="font-size:1rem;margin-bottom:0.8rem;">Create Member Account</h3>
          <p class="text-sm text-muted mb-3">Username + password only. They log in from any device worldwide.</p>
          <div id="create-alert" class="hidden"></div>
          <form id="create-form">
            <div class="form-group"><label>Username</label><input type="text" id="c-user" class="input" required minlength="3" autocapitalize="none" /></div>
            <div class="form-group"><label>Password</label><input type="password" id="c-pass" class="input" required minlength="6" /></div>
            <div class="form-group"><label>Rank</label><select id="c-rank" class="select">${rankOptions(1)}</select></div>
            <div class="form-group"><label>Role</label><select id="c-role" class="select"><option value="member">member</option><option value="moderator">moderator</option><option value="admin">admin</option></select></div>
            <button type="submit" class="btn">Create Account</button>
          </form>
          <p class="text-xs text-muted mt-3">Note: creating a user may sign you out — log back in as admin.</p>
        </div>`;
      // Remove broken create panel if present and append good one
      el.innerHTML = el.innerHTML.split('<div class="panel mb-4">\n        <h3')[0] + createHtml;

      document.getElementById("create-form").onsubmit = async function(e) {
        e.preventDefault();
        const username = document.getElementById("c-user").value.trim();
        const password = document.getElementById("c-pass").value;
        const rank = Number(document.getElementById("c-rank").value);
        const role = document.getElementById("c-role").value;
        const alert = document.getElementById("create-alert");
        const result = await createMemberAccount(username, password, rank, role);
        if (result.error) {
          alert.textContent = result.error;
          alert.className = "alert alert-error";
          alert.classList.remove("hidden");
          return;
        }
        alert.textContent = "Account created for " + username + ". Log in again if you were signed out.";
        alert.className = "alert alert-success";
        alert.classList.remove("hidden");
        // try restore admin session won't work without password - just reload users after delay
        setTimeout(() => location.reload(), 1500);
      };
    }

    window.saveUser = async function(id) {
      const rank = Number(document.getElementById("rank-"+id).value);
      const role = document.getElementById("role-"+id).value;
      const ok = await updateProfile(id, { rank_level: rank, role });
      alert(ok ? "Saved." : "Failed to save (check admin permissions).");
      render("users");
    };

    async function renderReports(el) {
      const rows = await getReports();
      let h = `<div class="panel mb-4"><h2 style="font-size:1.1rem;margin-bottom:1rem;">Add Report</h2>
        <form id="r-form">
          <div class="form-group"><label>Title</label><input id="r-title" class="input" required /></div>
          <div class="form-group"><label>Body</label><textarea id="r-body" class="textarea" required></textarea></div>
          <div class="form-group"><label>Min Rank</label><select id="r-rank" class="select">${rankOptions(1)}</select></div>
          <label style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem;"><input type="checkbox" id="r-class" /> Classified</label>
          <button class="btn" type="submit">Publish Report</button>
        </form></div><div class="panel"><h3 style="font-size:1rem;margin-bottom:0.8rem;">Existing</h3>`;
      rows.forEach(r => {
        h += '<div style="padding:0.6rem 0;border-bottom:1px solid var(--border);" class="flex justify-between"><div><strong>'+esc(r.title)+'</strong><div class="text-xs text-muted">'+getRankName(r.min_rank_level)+'+</div></div><button class="btn btn-danger btn-sm" onclick="delReport(\''+r.id+'\')">Delete</button></div>';
      });
      h += '</div>';
      el.innerHTML = h;
      document.getElementById("r-form").onsubmit = async function(e) {
        e.preventDefault();
        await saveReport({
          title: document.getElementById("r-title").value.trim(),
          body: document.getElementById("r-body").value,
          min_rank_level: Number(document.getElementById("r-rank").value),
          is_classified: document.getElementById("r-class").checked,
          status: "published",
          author_id: session.id,
          author_name: session.username
        });
        render("reports");
      };
    }
    window.delReport = async function(id) {
      if (!confirm("Delete report?")) return;
      await deleteReport(id);
      render("reports");
    };

    async function renderMerits(el) {
      const rows = await getMerits();
      let h = `<div class="panel mb-4"><h2 style="font-size:1.1rem;margin-bottom:1rem;">Add Merit</h2>
        <form id="m-form">
          <div class="form-group"><label>Title</label><input id="m-title" class="input" required /></div>
          <div class="form-group"><label>Recipient</label><input id="m-recip" class="input" /></div>
          <div class="form-group"><label>Description</label><textarea id="m-desc" class="textarea"></textarea></div>
          <button class="btn" type="submit">Add</button>
        </form></div><div class="panel">`;
      rows.forEach(m => {
        h += '<div style="padding:0.6rem 0;border-bottom:1px solid var(--border);" class="flex justify-between"><div><strong>'+esc(m.title)+'</strong><div class="text-xs text-muted">'+esc(m.recipient_name||"")+'</div></div><button class="btn btn-danger btn-sm" onclick="delMerit(\''+m.id+'\')">Delete</button></div>';
      });
      h += '</div>';
      el.innerHTML = h;
      document.getElementById("m-form").onsubmit = async function(e) {
        e.preventDefault();
        await saveMerit({
          title: document.getElementById("m-title").value.trim(),
          recipient_name: document.getElementById("m-recip").value.trim(),
          description: document.getElementById("m-desc").value,
          awarded_by: session.username
        });
        render("merits");
      };
    }
    window.delMerit = async function(id) { if(confirm("Delete?")){ await deleteMerit(id); render("merits"); } };

    async function renderTraining(el) {
      const rows = await getTraining();
      let h = `<div class="panel mb-4"><h2 style="font-size:1.1rem;margin-bottom:1rem;">Add Training</h2>
        <form id="t-form">
          <div class="form-group"><label>Title</label><input id="t-title" class="input" required /></div>
          <div class="form-group"><label>Content</label><textarea id="t-body" class="textarea"></textarea></div>
          <div class="form-group"><label>Category</label><input id="t-cat" class="input" /></div>
          <div class="form-group"><label>Min Rank</label><select id="t-rank" class="select">${rankOptions(1)}</select></div>
          <button class="btn" type="submit">Add</button>
        </form></div><div class="panel">`;
      rows.forEach(r => {
        h += '<div style="padding:0.6rem 0;border-bottom:1px solid var(--border);" class="flex justify-between"><strong>'+esc(r.title)+'</strong><button class="btn btn-danger btn-sm" onclick="delTrain(\''+r.id+'\')">Delete</button></div>';
      });
      h += '</div>';
      el.innerHTML = h;
      document.getElementById("t-form").onsubmit = async function(e) {
        e.preventDefault();
        await saveTrainingItem({
          title: document.getElementById("t-title").value.trim(),
          content: document.getElementById("t-body").value,
          category: document.getElementById("t-cat").value.trim(),
          min_rank_level: Number(document.getElementById("t-rank").value)
        });
        render("training");
      };
    }
    window.delTrain = async function(id){ if(confirm("Delete?")){ await deleteTraining(id); render("training"); }};

    async function renderTutorials(el) {
      const rows = await getTutorials();
      let h = `<div class="panel mb-4"><h2 style="font-size:1.1rem;margin-bottom:1rem;">Add Tutorial</h2>
        <form id="v-form">
          <div class="form-group"><label>Title</label><input id="v-title" class="input" required /></div>
          <div class="form-group"><label>URL</label><input id="v-url" class="input" required /></div>
          <div class="form-group"><label>Min Rank</label><select id="v-rank" class="select">${rankOptions(1)}</select></div>
          <button class="btn" type="submit">Add</button>
        </form></div><div class="panel">`;
      rows.forEach(r => {
        h += '<div style="padding:0.6rem 0;border-bottom:1px solid var(--border);" class="flex justify-between"><strong>'+esc(r.title)+'</strong><button class="btn btn-danger btn-sm" onclick="delTut(\''+r.id+'\')">Delete</button></div>';
      });
      h += '</div>';
      el.innerHTML = h;
      document.getElementById("v-form").onsubmit = async function(e) {
        e.preventDefault();
        await saveTutorial({
          title: document.getElementById("v-title").value.trim(),
          url: document.getElementById("v-url").value.trim(),
          min_rank_level: Number(document.getElementById("v-rank").value)
        });
        render("tutorials");
      };
    }
    window.delTut = async function(id){ if(confirm("Delete?")){ await deleteTutorial(id); render("tutorials"); }};

    async function renderLinks(el) {
      const rows = await getLinks();
      let h = `<div class="panel mb-4"><h2 style="font-size:1.1rem;margin-bottom:1rem;">Add Link</h2>
        <form id="l-form">
          <div class="form-group"><label>Title</label><input id="l-title" class="input" required /></div>
          <div class="form-group"><label>URL</label><input id="l-url" class="input" required /></div>
          <div class="form-group"><label>Platform</label><input id="l-plat" class="input" placeholder="Web / Desktop" /></div>
          <button class="btn" type="submit">Add</button>
        </form></div><div class="panel">`;
      rows.forEach(r => {
        h += '<div style="padding:0.6rem 0;border-bottom:1px solid var(--border);" class="flex justify-between"><strong>'+esc(r.title)+'</strong><button class="btn btn-danger btn-sm" onclick="delLink(\''+r.id+'\')">Delete</button></div>';
      });
      h += '</div>';
      el.innerHTML = h;
      document.getElementById("l-form").onsubmit = async function(e) {
        e.preventDefault();
        await saveLink({
          title: document.getElementById("l-title").value.trim(),
          url: document.getElementById("l-url").value.trim(),
          platform: document.getElementById("l-plat").value.trim()
        });
        render("links");
      };
    }
    window.delLink = async function(id){ if(confirm("Delete?")){ await deleteLink(id); render("links"); }};

    (async function() {
      initSupabase();
      session = await requireAdmin();
      if (!session) return;
      await applyBackground(); showVersion();
      await render("reports");
    })();
  </script>
</body>
</html>
