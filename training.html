<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css?v=7" />
  <script src="js/data.js?v=7"></script>
  <script src="js/ranks-icons.js?v=7"></script>
</head>
<body>
  <script>renderNavbar("training.html"); applyBackground();</script>

  <div class="container">
    <div class="mb-6">
      <h1 style="font-size:1.45rem;">Training Materials</h1>
      <p class="text-muted text-sm">SOPs, guides and doctrinal resources</p>
    </div>
    <div id="list" class="card-grid"></div>
  </div>

  <script>
    const session = requireAuth();
    if (!session) throw new Error("redirect");

    const items = getTraining().filter(t => canAccess(session.rank_level, t.min_rank_level)).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    const list = document.getElementById("list");

    if (items.length === 0) {
      list.innerHTML = `<div class="panel text-center" style="padding:3rem;grid-column:1/-1;"><p class="text-muted">No training materials available at your rank level.</p></div>`;
    } else {
      list.innerHTML = items.map(item => {
        const hasAccess = canAccess(session.rank_level, item.min_rank_level);
        return `
          <div class="card" style="${hasAccess ? '' : 'opacity:0.5;'}">
            <div class="flex justify-between items-center">
              <h3>${esc(item.title)}</h3>
              ${!hasAccess ? '<span style="color:var(--warning);">🔒</span>' : ''}
            </div>
            <p class="text-sm text-muted mt-2">${esc(item.description)}</p>
            <div class="mt-2">
              <span class="badge badge-rank rank-${item.min_rank_level}">${typeof rankIcon==="function"?rankIcon(item.min_rank_level,14):""} ${getRankName(item.min_rank_level)}+</span>
              <span class="text-xs text-muted" style="margin-left:0.4rem;">${esc(item.category || "General")}</span>
            </div>
            ${hasAccess ? `
              <div class="mt-4 flex gap-2">
                ${item.file_url ? `<a href="${esc(item.file_url)}" target="_blank" class="btn btn-sm">Download</a>` : ''}
                ${item.external_url ? `<a href="${esc(item.external_url)}" target="_blank" class="btn btn-outline btn-sm">Open Link</a>` : ''}
              </div>` : ''}
          </div>`;
      }).join("");
    }

    function esc(s) {
      if (!s) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
