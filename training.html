<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css?v=s7" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=s7"></script>
  <script src="js/data.js?v=s7"></script>
  <script src="js/ranks-icons.js?v=s7"></script>
</head>
<body>
  <div id="app"><p class="text-muted text-center" style="padding:3rem;">Loading…</p></div>
  <script>
    (async function() {
      initSupabase();
      const session = await requireAuth();
      if (!session) return;
      await applyBackground(); showVersion();
      const items = (await getTraining()).filter(t => canAccess(session.rank_level, t.min_rank_level));
      let html = '<nav class="navbar"><div class="nav-inner"><div class="nav-brand"><span>◆</span> TACTICAL ARCHIVE</div><div class="nav-links">';
      [["dashboard.html","Dashboard"],["reports.html","Reports"],["voting.html","Voting"],["training.html","Training"],["tutorials.html","Tutorials"],["tactical-centre.html","Tactical Centre"]].forEach(([h,l]) => {
        html += '<a href="'+h+'" class="'+(h==="training.html"?"active":"")+'">'+l+'</a>';
      });
      if (session.role==="admin") html += '<a href="admin.html" style="color:#fbbf24">Admin</a>';
      html += '</div><div class="nav-user"><div><div style="font-weight:600">'+esc(session.username)+'</div><div>'+formatRank(session.rank_level)+'</div></div><button class="btn-logout" onclick="logout()">Logout</button></div></div></nav>';
      html += '<div class="container"><h1 style="font-size:1.45rem;margin-bottom:1rem;">Training</h1>';
      if (!items.length) html += '<div class="panel text-center" style="padding:3rem;"><p class="text-muted">No training for your rank.</p></div>';
      items.forEach(t => {
        html += '<div class="panel mb-4"><h3>'+esc(t.title)+'</h3><div class="text-xs text-muted mb-2">'+esc(t.category||"")+' · '+getRankName(t.min_rank_level)+'+</div><div style="white-space:pre-wrap;">'+esc(t.content||"")+'</div></div>';
      });
      html += '</div>';
      document.getElementById("app").innerHTML = html;
    })();
  </script>
</body>
</html>
