<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="nav-brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
        TACTICAL ARCHIVE
      </div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="reports.html">Reports</a>
        <a href="merits.html">Merits</a>
        <a href="training.html" class="active">Training</a>
        <a href="tutorials.html">Tutorials</a>
        <a href="tactical-centre.html">Tactical Centre</a>
        <a href="admin.html" id="nav-admin" class="hidden" style="color:#fbbf24;">Admin</a>
      </div>
      <div class="nav-user">
        <div>
          <div id="nav-username" style="font-weight:600;">—</div>
          <div id="nav-rank" class="rank text-xs">—</div>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="mb-6">
      <h1 style="font-size:1.5rem;">Training Materials</h1>
      <p class="text-muted text-sm">SOPs, guides and doctrinal resources</p>
    </div>
    <div id="training-list" class="card-grid"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initSupabase();
    (async () => {
      const profile = await protectPage();
      if (!profile) return;

      const { data: items } = await supabase
        .from("training_materials")
        .select("*")
        .order("created_at", { ascending: false });

      const list = document.getElementById("training-list");
      if (!items || items.length === 0) {
        list.innerHTML = `<div class="panel text-center" style="padding:3rem;grid-column:1/-1;"><p class="text-muted">No training materials available.</p></div>`;
        return;
      }

      list.innerHTML = items.map(item => {
        const hasAccess = canAccess(profile.rank_level, item.min_rank_level);
        return `
          <div class="card" style="${hasAccess ? '' : 'opacity:0.55;'}">
            <div class="flex justify-between items-center">
              <h3>${escapeHtml(item.title)}</h3>
              ${!hasAccess ? '<span style="color:var(--warning);">🔒</span>' : ''}
            </div>
            <p class="text-sm text-muted mt-2">${escapeHtml(item.description)}</p>
            <div class="mt-2">
              <span class="badge badge-rank rank-${item.min_rank_level}">${getRankName(item.min_rank_level)}+</span>
              <span class="text-xs text-muted" style="margin-left:0.5rem;">${escapeHtml(item.category)}</span>
            </div>
            ${hasAccess ? `
              <div class="mt-4 flex gap-2">
                ${item.file_url ? `<a href="${item.file_url}" target="_blank" class="btn text-sm">Download</a>` : ''}
                ${item.external_url ? `<a href="${item.external_url}" target="_blank" class="btn btn-outline text-sm">Open Link</a>` : ''}
              </div>` : ''}
          </div>`;
      }).join("");
    })();

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
