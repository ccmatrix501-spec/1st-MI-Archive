<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merits & Awards – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="nav-brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
        TACTICAL ARCHIVE
      </div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="reports.html">Reports</a>
        <a href="merits.html" class="active">Merits</a>
        <a href="training.html">Training</a>
        <a href="tutorials.html">Tutorials</a>
        <a href="tactical-centre.html">Tactical Centre</a>
        <a href="admin.html" id="nav-admin" class="hidden" style="color:#fbbf24;">Admin</a>
      </div>
      <div class="nav-user">
        <div>
          <div id="nav-username" style="font-weight:600;">—</div>
          <div id="nav-rank" class="rank text-xs">—</div>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="mb-6">
      <h1 style="font-size:1.5rem;">Merits & Awards</h1>
      <p class="text-muted text-sm">Official recognitions, medals and commendations</p>
    </div>
    <div id="merits-list">
      <p class="text-muted text-center" style="padding:3rem 0;">Loading...</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initSupabase();
    (async () => {
      const profile = await protectPage();
      if (!profile) return;

      const { data: merits, error } = await supabase
        .from("merits_awards")
        .select(`
          *,
          recipient:profiles!merits_awards_recipient_id_fkey (username, rank_level),
          awarder:profiles!merits_awards_awarded_by_fkey (username)
        `)
        .order("date_awarded", { ascending: false });

      const list = document.getElementById("merits-list");
      if (error || !merits || merits.length === 0) {
        list.innerHTML = `<div class="panel text-center" style="padding:3rem;"><p class="text-muted">No merits or awards recorded yet.</p></div>`;
        return;
      }

      list.innerHTML = merits.map(m => {
        const date = new Date(m.date_awarded).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
        return `
          <div class="panel mb-4">
            <div class="flex justify-between items-center" style="gap:1rem;flex-wrap:wrap;">
              <div>
                <div class="flex items-center gap-2" style="flex-wrap:wrap;margin-bottom:0.35rem;">
                  <strong>${escapeHtml(m.title)}</strong>
                  <span class="badge" style="background:#422006;color:#fbbf24;border-color:#854d0e;text-transform:capitalize;">${m.award_type}</span>
                </div>
                <p class="text-sm text-muted">${escapeHtml(m.description)}</p>
                <div class="text-xs text-muted mt-2">
                  Recipient: <span style="color:#86efac;">${m.recipient?.username || "?"}</span>
                  ${m.recipient ? `(${getRankName(m.recipient.rank_level)})` : ""} •
                  ${date}
                  ${m.awarder ? ` • Awarded by ${m.awarder.username}` : ""}
                </div>
              </div>
              ${m.file_url ? `<a href="${m.file_url}" target="_blank" class="btn text-sm">Download</a>` : ""}
            </div>
          </div>`;
      }).join("");
    })();

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
