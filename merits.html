<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merits – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/data.js"></script>
  <script src="js/ranks-icons.js"></script>
</head>
<body>
  <script>renderNavbar("merits.html"); applyBackground();</script>

  <div class="container">
    <div class="mb-6">
      <h1 style="font-size:1.45rem;">Merits & Awards</h1>
      <p class="text-muted text-sm">Official recognitions, medals and commendations</p>
    </div>
    <div id="list"></div>
  </div>

  <script>
    const session = requireAuth();
    if (!session) throw new Error("redirect");

    const merits = getMerits().sort((a,b) => new Date(b.date_awarded) - new Date(a.date_awarded));
    const list = document.getElementById("list");

    if (merits.length === 0) {
      list.innerHTML = `<div class="panel text-center" style="padding:3rem;"><p class="text-muted">No merits or awards recorded yet.</p></div>`;
    } else {
      list.innerHTML = merits.map(m => {
        const date = new Date(m.date_awarded).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
        return `
          <div class="panel mb-4">
            <div class="flex justify-between items-center" style="gap:1rem;flex-wrap:wrap;">
              <div>
                <div class="flex items-center gap-2" style="flex-wrap:wrap;margin-bottom:0.3rem;">
                  <strong>${esc(m.title)}</strong>
                  <span class="badge" style="background:#422006;color:#fbbf24;border-color:#854d0e;text-transform:capitalize;">${esc(m.award_type)}</span>
                </div>
                <p class="text-sm text-muted">${esc(m.description)}</p>
                <div class="text-xs text-muted mt-2">
                  Recipient: <span style="color:#86efac;">${esc(m.recipient_name)}</span> • ${date}
                  ${m.awarded_by_name ? ` • By ${esc(m.awarded_by_name)}` : ""}
                </div>
              </div>
              ${m.file_url ? `<a href="${esc(m.file_url)}" target="_blank" class="btn btn-sm">Download</a>` : ""}
            </div>
          </div>`;
      }).join("");
    }

    function esc(s) {
      if (!s) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
