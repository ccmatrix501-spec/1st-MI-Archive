<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merits – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ranks-icons.js"></script>
</head>
<body>
  <div id="app"><p class="text-muted text-center" style="padding:3rem;">Loading…</p></div>
  <script>
    function buildNav(session, companies, active) {
      var isAdmin = session.role === "admin";
      var links = [["dashboard.html","Dashboard"],["reports.html","Reports"],["voting.html","Voting"],["training.html","Training"],["tutorials.html","Tutorials"],["tactical-centre.html","Tactical Centre"],["profile.html","Profile"]];
      if (isAdmin) { links.push(["merits.html","Merits"]); links.push(["admin.html","Admin"]); }
      var h = '<nav class="navbar"><div class="nav-inner"><div class="nav-brand"><span>◆</span> TACTICAL ARCHIVE</div><div class="nav-links">';
      links.forEach(function(pair) {
        var gold = (pair[1]==="Admin"||pair[1]==="Merits") ? "color:#fbbf24" : "";
        h += '<a href="'+pair[0]+'" class="'+(pair[0]===active?"active":"")+'" style="'+gold+'">'+pair[1]+'</a>';
      });
      h += '</div><div class="nav-user"><div><div style="font-weight:600">'+esc(session.username)+'</div></div><button class="btn-logout" onclick="logout()">Logout</button></div></div></nav>';
      return h;
    }
    function previewJson(data) {
      if (data == null) return '<p class="text-muted text-sm">No JSON data.</p>';
      var rows = [];
      if (Array.isArray(data)) rows = data;
      else if (Array.isArray(data.entries)) rows = data.entries;
      else if (Array.isArray(data.merits)) rows = data.merits;
      else if (Array.isArray(data.awards)) rows = data.awards;
      else if (typeof data === "object") {
        // object map of id -> record
        var keys = Object.keys(data);
        if (keys.every(function(k){ return data[k] && typeof data[k] === "object"; })) {
          rows = keys.map(function(k){ return Object.assign({ _key: k }, data[k]); });
        }
      }
      if (rows.length) {
        var h = '<div style="overflow:auto;"><table style="width:100%;border-collapse:collapse;font-size:0.85rem;">';
        var cols = Object.keys(rows[0] || {}).slice(0, 8);
        h += '<thead><tr>';
        cols.forEach(function(c){ h += '<th style="text-align:left;padding:0.4rem;border-bottom:1px solid var(--border);color:var(--muted);">'+esc(c)+'</th>'; });
        h += '</tr></thead><tbody>';
        rows.slice(0, 200).forEach(function(row) {
          h += '<tr>';
          cols.forEach(function(c) {
            var v = row[c];
            if (v != null && typeof v === "object") v = JSON.stringify(v);
            h += '<td style="padding:0.4rem;border-bottom:1px solid var(--border);vertical-align:top;">'+esc(v == null ? "" : String(v))+'</td>';
          });
          h += '</tr>';
        });
        h += '</tbody></table></div>';
        if (rows.length > 200) h += '<p class="text-xs text-muted mt-2">Showing first 200 of '+rows.length+' rows. Download JSON for full data.</p>';
        return h;
      }
      return '<pre style="white-space:pre-wrap;font-size:0.78rem;max-height:280px;overflow:auto;background:#0c120c;padding:0.75rem;border-radius:8px;border:1px solid var(--border);">'+esc(JSON.stringify(data, null, 2))+'</pre>';
    }
    (async function() {
      initSupabase();
      var session = await requireAuth();
      if (!session) return;
      if (session.role !== "admin") { location.href = "dashboard.html"; return; }
      await applyBackground(); showVersion();
      var companies = await getCompanies();
      var items = await getMerits();
      var html = buildNav(session, companies, "merits.html");
      html += '<div class="container"><h1 style="font-size:1.45rem;margin-bottom:0.5rem;">Merits & Awards</h1>';
      html += '<p class="text-muted text-sm mb-6">Tracking data uploaded as JSON from Admin.</p>';
      if (!items.length) html += '<div class="panel text-center" style="padding:3rem;"><p class="text-muted">No JSON tracking files yet. Upload under Admin → Merits.</p></div>';
      items.forEach(function(m) {
        html += '<div class="panel mb-4"><div class="flex justify-between" style="flex-wrap:wrap;gap:0.5rem;margin-bottom:0.75rem;">';
        html += '<div><h3 style="margin:0;font-size:1.1rem;">'+esc(m.title||"Merits file")+'</h3>';
        html += '<div class="text-xs text-muted">'+esc(m.file_name||"")+' · by '+esc(m.awarded_by||"")+' · '+new Date(m.created_at).toLocaleString()+'</div>';
        if (m.description) html += '<p class="text-sm text-muted mt-1">'+esc(m.description)+'</p>';
        html += '</div>';
        if (m.file_url) html += '<a class="btn btn-sm" href="'+esc(m.file_url)+'" target="_blank" rel="noopener" download>Download JSON</a>';
        html += '</div>'+previewJson(m.data)+'</div>';
      });
      html += '</div>';
      document.getElementById("app").innerHTML = html;
    })();
  </script>
</body>
</html>
