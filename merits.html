<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merits – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css?v=s7" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=s7"></script>
  <script src="js/data.js?v=s7"></script>
  <script src="js/ranks-icons.js?v=s7"></script>
</head>
<body>
  <div id="app"><p class="text-muted text-center" style="padding:3rem;">Loading…</p></div>
  <script>
    (async function() {
      initSupabase();
      const session = await requireAuth();
      if (!session) return;
      if (session.role !== "admin") { location.href = "dashboard.html"; return; }
      await applyBackground(); showVersion();
      const items = await getMerits();
      let html = '<nav class="navbar"><div class="nav-inner"><div class="nav-brand"><span>◆</span> TACTICAL ARCHIVE</div><div class="nav-links">';
      [["dashboard.html","Dashboard"],["reports.html","Reports"],["voting.html","Voting"],["merits.html","Merits"],["admin.html","Admin"]].forEach(([h,l]) => {
        html += '<a href="'+h+'" class="'+(h==="merits.html"?"active":"")+'" style="color:#fbbf24">'+l+'</a>';
      });
      html += '</div><div class="nav-user"><div><div style="font-weight:600">'+esc(session.username)+'</div></div><button class="btn-logout" onclick="logout()">Logout</button></div></div></nav>';
      html += '<div class="container"><h1 style="font-size:1.45rem;margin-bottom:1rem;">Merits & Awards</h1>';
      if (!items.length) html += '<div class="panel text-center" style="padding:3rem;"><p class="text-muted">No merits yet.</p></div>';
      items.forEach(m => {
        html += '<div class="panel mb-4"><h3>'+esc(m.title)+'</h3><div class="text-xs text-muted mb-2">Recipient: '+esc(m.recipient_name||"—")+' · By '+esc(m.awarded_by||"")+'</div><p class="text-sm">'+esc(m.description||"")+'</p></div>';
      });
      html += '</div>';
      document.getElementById("app").innerHTML = html;
    })();
  </script>
</body>
</html>
