<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tactical Archive – Login</title>
  <link rel="stylesheet" href="css/style.css?v=7" />
  <style>
    .input { font-size: 16px !important; min-height: 44px; -webkit-appearance: none; border-radius: 8px; }
    .btn { min-height: 48px; font-size: 1rem; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .login-wrap { padding: 1rem; align-items: flex-start; padding-top: 8vh; }
    #sync-status { text-align: center; font-size: 0.75rem; color: #6b7b6b; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-header">
        <div style="font-size:2.5rem;color:var(--accent);margin-bottom:0.5rem;">◆</div>
        <h1>TACTICAL ARCHIVE</h1>
        <p>Secure community central archive</p>
      </div>
      <div class="panel">
        <h2 class="text-center" style="font-size:1.1rem;margin-bottom:1.2rem;">Login</h2>
        <div id="alert" class="hidden"></div>
        <form id="auth-form" action="#" method="post">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="input" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="input" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn w-full" id="submit-btn">Login</button>
        </form>
        <p class="text-center text-xs text-muted mt-4">Accounts are issued by unit leadership. Contact an admin if you need access.</p>
        <div id="sync-status">Loading unit accounts…</div>
      </div>
    </div>
  </div>
  <script src="js/data.js?v=7"></script>
  <script src="js/ranks-icons.js?v=7"></script>
  <script>
    try { applyBackground(); } catch (e) {}
    try { showVersion(); } catch (e) {}
    var syncStatus = document.getElementById("sync-status");
    var ready = false;
    syncFromSharedFile().then(function(r) {
      ready = true;
      if (r && r.ok) {
        syncStatus.textContent = "Unit accounts loaded (" + r.users + "). Build " + SITE_VERSION;
        syncStatus.style.color = "#86efac";
      } else {
        syncStatus.textContent = "Local accounts only. Build " + SITE_VERSION;
      }
      try { if (getSession()) window.location.replace("dashboard.html"); } catch (e) {}
    });
    var form = document.getElementById("auth-form");
    var alertBox = document.getElementById("alert");
    var btn = document.getElementById("submit-btn");
    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.className = "alert alert-error";
      alertBox.classList.remove("hidden");
    }
    form.addEventListener("submit", function(e) {
      e.preventDefault();
      e.stopPropagation();
      alertBox.classList.add("hidden");
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;
      if (!username || !password) { showError("Enter username and password."); return false; }
      btn.disabled = true;
      btn.textContent = "Please wait...";
      function doAuth() {
        try {
          var result = login(username, password);
          if (result && result.error) {
            showError(result.error);
            btn.disabled = false;
            btn.textContent = "Login";
            return;
          }
          if (!getSession()) {
            showError("Could not save login. Turn off Private Browsing.");
            btn.disabled = false;
            btn.textContent = "Login";
            return;
          }
          setTimeout(function() { window.location.replace("dashboard.html"); }, 50);
        } catch (err) {
          showError("Login error: " + (err.message || "Unknown"));
          btn.disabled = false;
          btn.textContent = "Login";
        }
      }
      if (!ready) syncFromSharedFile().finally(doAuth);
      else doAuth();
      return false;
    });
  </script>
</body>
</html>
