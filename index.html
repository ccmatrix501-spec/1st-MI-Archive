<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tactical Archive – Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-header">
        <div style="font-size:2.5rem;color:var(--accent);margin-bottom:0.5rem;">◆</div>
        <h1>TACTICAL ARCHIVE</h1>
        <p>Secure community central archive</p>
      </div>

      <div class="panel">
        <h2 id="form-title" class="text-center" style="font-size:1.1rem;margin-bottom:1.2rem;">Login</h2>
        <div id="alert" class="hidden"></div>

        <form id="auth-form">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" class="input" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="input" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn w-full" id="submit-btn">Login</button>
        </form>

        <p class="text-center text-sm text-muted mt-4">
          <span id="toggle-text">Need an account?</span>
          <a href="#" id="toggle-mode" style="color:#86efac;">Register</a>
        </p>
      </div>

      <div class="panel mt-4" style="border-left:4px solid var(--warning);">
        <p class="text-xs text-muted">
          <strong style="color:var(--warning);">Default admin:</strong><br>
          Username: <code>admin</code> &nbsp; Password: <code>admin123</code><br>
          Change this password after first login (Admin panel → Users).
        </p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    // Already logged in?
    if (getSession()) window.location.href = "dashboard.html";

    let isRegister = false;
    const form = document.getElementById("auth-form");
    const alertBox = document.getElementById("alert");
    const toggle = document.getElementById("toggle-mode");
    const title = document.getElementById("form-title");
    const toggleText = document.getElementById("toggle-text");
    const btn = document.getElementById("submit-btn");

    toggle.addEventListener("click", e => {
      e.preventDefault();
      isRegister = !isRegister;
      title.textContent = isRegister ? "Register" : "Login";
      btn.textContent = isRegister ? "Create Account" : "Login";
      toggleText.textContent = isRegister ? "Already have an account?" : "Need an account?";
      toggle.textContent = isRegister ? "Login" : "Register";
      alertBox.classList.add("hidden");
    });

    form.addEventListener("submit", e => {
      e.preventDefault();
      alertBox.classList.add("hidden");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const result = isRegister ? register(username, password) : login(username, password);

      if (result.error) {
        alertBox.textContent = result.error;
        alertBox.className = "alert alert-error";
        alertBox.classList.remove("hidden");
      } else {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
