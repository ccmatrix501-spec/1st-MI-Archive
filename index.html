<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tactical Archive – Login</title>
  <link rel="stylesheet" href="css/style.css?v=s10" />
  <style>
    .input { font-size: 16px !important; min-height: 44px; -webkit-appearance: none; border-radius: 8px; }
    .btn { min-height: 48px; font-size: 1rem; touch-action: manipulation; }
    .login-wrap { padding: 1rem; align-items: flex-start; padding-top: 8vh; }
    #conn-status { text-align: center; font-size: 0.75rem; color: #6b7b6b; margin-top: 0.75rem; word-break: break-word; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-header">
        <div style="font-size:2.5rem;color:var(--accent);margin-bottom:0.5rem;">◆</div>
        <h1>TACTICAL ARCHIVE</h1>
        <p>Shared unit database · username login</p>
      </div>
      <div class="panel">
        <h2 class="text-center" style="font-size:1.1rem;margin-bottom:1.2rem;">Login</h2>
        <div id="alert" class="hidden"></div>
        <form id="auth-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" class="input" required autocomplete="username"
                   autocapitalize="none" autocorrect="off" spellcheck="false" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="input" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn w-full" id="submit-btn">Login</button>
        </form>
        <p class="text-center text-xs text-muted mt-4">Accounts issued by unit leadership. No email required.</p>
        <div id="conn-status">Loading…</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=s10"></script>
  <script>
    // Prefer keys from config.js; fall back to inline only if needed
    var SUPABASE_URL = (window.TA_CONFIG && window.TA_CONFIG.SUPABASE_URL) || "https://gubizstvrwaxrnivciqy.supabase.co";
    var SUPABASE_ANON_KEY = (window.TA_CONFIG && window.TA_CONFIG.SUPABASE_ANON_KEY) || "PASTE_YOUR_ANON_KEY_HERE";
    var SITE_VERSION = (window.SITE_VERSION) || "2026-07-28-s10";
    var client = null;

    var alertBox = document.getElementById("alert");
    var btn = document.getElementById("submit-btn");
    var statusEl = document.getElementById("conn-status");

    function showError(msg) {
      if (!alertBox) return;
      alertBox.textContent = msg;
      alertBox.className = "alert alert-error";
      alertBox.classList.remove("hidden");
    }
    function resetBtn() {
      if (!btn) return;
      btn.disabled = false;
      btn.textContent = "Login";
    }
    function setStatus(msg, color) {
      if (!statusEl) return;
      statusEl.textContent = msg;
      if (color) statusEl.style.color = color;
    }
    function usernameToEmail(username) {
      var clean = String(username || "").trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");
      return clean + "@unit.local";
    }

    function init() {
      try {
        if (!window.supabase || !window.supabase.createClient) {
          setStatus("ERROR: Supabase library failed to load (CDN blocked?)", "#f87171");
          return;
        }
        if (!SUPABASE_ANON_KEY || String(SUPABASE_ANON_KEY).indexOf("PASTE_") === 0) {
          setStatus("ERROR: Paste anon key into js/config.js", "#f87171");
          return;
        }
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        setStatus("Connected · build " + SITE_VERSION, "#86efac");

        client.auth.getSession().then(function (res) {
          if (res.data && res.data.session) {
            window.location.replace("dashboard.html");
          }
        });
      } catch (err) {
        setStatus("Init error: " + (err.message || err), "#f87171");
      }
    }

    async function doLogin(username, password) {
      var email = usernameToEmail(username);
      var res = await client.auth.signInWithPassword({ email: email, password: password });
      if (res.error) {
        var msg = res.error.message || "Login failed";
        if (/invalid login|invalid credentials/i.test(msg)) return { error: "Invalid username or password" };
        if (/email not confirmed/i.test(msg)) return { error: "Turn OFF Confirm email in Supabase Auth settings" };
        return { error: msg };
      }
      if (!res.data || !res.data.user) return { error: "Login failed (no user)" };

      var userId = res.data.user.id;
      var profileRes = await client.from("profiles").select("*").eq("id", userId).maybeSingle();
      if (profileRes.error) return { error: "Profile read failed: " + profileRes.error.message };

      var profile = profileRes.data;
      if (!profile) {
        var uname = String(username).trim().toLowerCase();
        var ins = await client.from("profiles").insert({
          id: userId,
          username: uname,
          role: "admin",
          rank_level: 22
        }).select("*").maybeSingle();
        if (ins.error) {
          return { error: "No profile. Run profile SQL in Supabase. (" + ins.error.message + ")" };
        }
      }
      return { ok: true };
    }

    document.getElementById("auth-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      if (alertBox) alertBox.classList.add("hidden");
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;
      if (!username || !password) { showError("Enter username and password."); return; }
      if (!client) { showError("Not connected. Fix the error under the button first."); return; }

      btn.disabled = true;
      btn.textContent = "Please wait...";

      var timedOut = false;
      var timer = setTimeout(function () {
        timedOut = true;
        showError("Timed out. Check anon key and internet.");
        resetBtn();
      }, 15000);

      try {
        var result = await doLogin(username, password);
        clearTimeout(timer);
        if (timedOut) return;
        if (result.error) {
          showError(result.error);
          resetBtn();
          return;
        }
        window.location.replace("dashboard.html");
      } catch (err) {
        clearTimeout(timer);
        showError("Login error: " + (err && err.message ? err.message : String(err)));
        resetBtn();
      }
    });

    try {
      var stamp = document.createElement("div");
      stamp.style.cssText = "position:fixed;bottom:6px;right:8px;font-size:10px;color:#4a5a4a;z-index:99;";
      stamp.textContent = "build " + SITE_VERSION;
      document.body.appendChild(stamp);
    } catch (e) {}

    init();
  </script>
</body>
</html>
