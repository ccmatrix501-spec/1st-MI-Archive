<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tactical Archive – Secure Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-header">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
        <h1>TACTICAL ARCHIVE</h1>
        <p>Secure community central archive</p>
      </div>

      <div class="panel">
        <h2 id="form-title" style="text-align:center;margin-bottom:1.25rem;font-size:1.15rem;">Secure Login</h2>

        <div id="alert" class="hidden"></div>

        <form id="auth-form">
          <div id="username-group" class="form-group hidden">
            <label>Username / Callsign</label>
            <input type="text" id="username" class="input" placeholder="Your callsign" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" class="input" placeholder="you@unit.mil" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="input" placeholder="••••••••" required minlength="6" />
          </div>
          <button type="submit" class="btn w-full" id="submit-btn">Login</button>
        </form>

        <p class="text-center text-sm text-muted mt-4">
          <span id="toggle-text">Need access?</span>
          <a href="#" id="toggle-mode" style="color:#86efac;">Request account</a>
        </p>
      </div>

      <p class="text-center text-xs text-muted mt-6">
        All activity is logged. Unauthorized access is prohibited.
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initSupabase();

    // Redirect if already logged in
    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = "dashboard.html";
    })();

    let isSignUp = false;
    const form = document.getElementById("auth-form");
    const alertBox = document.getElementById("alert");
    const toggleMode = document.getElementById("toggle-mode");
    const formTitle = document.getElementById("form-title");
    const usernameGroup = document.getElementById("username-group");
    const toggleText = document.getElementById("toggle-text");
    const submitBtn = document.getElementById("submit-btn");

    toggleMode.addEventListener("click", (e) => {
      e.preventDefault();
      isSignUp = !isSignUp;
      formTitle.textContent = isSignUp ? "Create Account" : "Secure Login";
      submitBtn.textContent = isSignUp ? "Create Account" : "Login";
      usernameGroup.classList.toggle("hidden", !isSignUp);
      toggleText.textContent = isSignUp ? "Already have an account?" : "Need access?";
      toggleMode.textContent = isSignUp ? "Login" : "Request account";
      alertBox.classList.add("hidden");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const username = document.getElementById("username").value.trim();

      try {
        if (isSignUp) {
          const { error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { username: username || email.split("@")[0] } }
          });
          if (error) throw error;
          showAlert("Account created. You can now log in.", "success");
          isSignUp = false;
          toggleMode.click();
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = "dashboard.html";
        }
      } catch (err) {
        showAlert(err.message || "Authentication failed", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isSignUp ? "Create Account" : "Login";
      }
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert alert-${type}`;
      alertBox.classList.remove("hidden");
    }
  </script>
</body>
</html>
