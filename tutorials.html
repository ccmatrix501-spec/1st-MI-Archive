<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorials – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/data.js"></script>
  <script src="js/ranks-icons.js"></script>
</head>
<body>
  <script>renderNavbar("tutorials.html"); applyBackground();</script>

  <div class="container">
    <div class="mb-6">
      <h1 style="font-size:1.45rem;">Tutorial Videos</h1>
      <p class="text-muted text-sm">Instructional and tactical video library</p>
    </div>
    <div id="list" class="card-grid"></div>
  </div>

  <script>
    const session = requireAuth();
    if (!session) throw new Error("redirect");

    const items = getTutorials().filter(t => canAccess(session.rank_level, t.min_rank_level)).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    const list = document.getElementById("list");

    if (items.length === 0) {
      list.innerHTML = `<div class="panel text-center" style="padding:3rem;grid-column:1/-1;"><p class="text-muted">No tutorials available at your rank level.</p></div>`;
    } else {
      list.innerHTML = items.map(item => {
        const hasAccess = canAccess(session.rank_level, item.min_rank_level);
        return `
          <div class="card" style="${hasAccess ? '' : 'opacity:0.5;'}">
            <div style="aspect-ratio:16/9;background:var(--bg);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:0.7rem;position:relative;">
              <span style="font-size:1.8rem;opacity:0.35;">▶</span>
              ${!hasAccess ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;border-radius:6px;"><span>🔒</span></div>` : ''}
            </div>
            <h3>${esc(item.title)}</h3>
            <p class="text-sm text-muted mt-1">${esc(item.description)}</p>
            <div class="mt-2 flex justify-between items-center">
              <span class="badge badge-rank rank-${item.min_rank_level}">${typeof rankIcon==="function"?rankIcon(item.min_rank_level,14):""} ${getRankName(item.min_rank_level)}+</span>
              ${item.duration_minutes ? `<span class="text-xs text-muted">${item.duration_minutes} min</span>` : ''}
            </div>
            ${hasAccess && item.video_url ? `<a href="${esc(item.video_url)}" target="_blank" class="btn w-full btn-sm mt-3" style="justify-content:center;">Watch</a>` : ''}
          </div>`;
      }).join("");
    }

    function esc(s) {
      if (!s) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
