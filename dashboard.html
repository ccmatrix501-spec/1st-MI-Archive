<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css?v=s7" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=s7"></script>
</head>
<body>
  <div id="root">
    <p class="text-muted text-center" style="padding:3rem;">Loading dashboard…</p>
  </div>

  <script>
    var SITE_VERSION = "2026-07-28-s6";

    function esc(s) {
      if (!s) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function getClient() {
      var cfg = window.TA_CONFIG || {};
      if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || String(cfg.SUPABASE_ANON_KEY).indexOf("PASTE_") === 0) {
        throw new Error("Paste your anon key into js/config.js");
      }
      if (!window.supabase || !window.supabase.createClient) {
        throw new Error("Supabase library failed to load");
      }
      return window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    }

    async function main() {
      var root = document.getElementById("root");
      try {
        var client = getClient();
        var sess = await client.auth.getSession();
        var session = sess.data && sess.data.session;
        if (!session) {
          window.location.replace("index.html");
          return;
        }

        var userId = session.user.id;
        var email = session.user.email || "";
        var profileRes = await client.from("profiles").select("*").eq("id", userId).maybeSingle();
        var profile = profileRes.data;

        if (!profile) {
          var uname = email.split("@")[0] || "user";
          var ins = await client.from("profiles").insert({
            id: userId, username: uname, role: "member", rank_level: 1
          }).select("*").maybeSingle();
          profile = ins.data || { username: uname, role: "member", rank_level: 1 };
        }

        var username = profile.username || "Operator";
        var role = profile.role || "member";
        var rank = profile.rank_level || 1;
        var isAdmin = role === "admin";

        // Counts
        var reports = (await client.from("reports").select("id", { count: "exact", head: true })).count || 0;
        var polls = (await client.from("polls").select("id", { count: "exact", head: true })).count || 0;
        var training = (await client.from("training").select("id", { count: "exact", head: true })).count || 0;
        var tutorials = (await client.from("tutorials").select("id", { count: "exact", head: true })).count || 0;
        var links = (await client.from("links").select("id", { count: "exact", head: true })).count || 0;
        var merits = 0;
        if (isAdmin) {
          merits = (await client.from("merits").select("id", { count: "exact", head: true })).count || 0;
        }

        var navLinks = [
          ["dashboard.html", "Dashboard"],
          ["reports.html", "Reports"],
          ["voting.html", "Voting"],
          ["training.html", "Training"],
          ["tutorials.html", "Tutorials"],
          ["tactical-centre.html", "Tactical Centre"]
        ];
        if (isAdmin) {
          navLinks.push(["merits.html", "Merits"]);
          navLinks.push(["admin.html", "Admin"]);
          navLinks.push(["profile.html", "Profile"]);
        }

        var nav = '<nav class="navbar"><div class="nav-inner">';
        nav += '<div class="nav-brand"><span>◆</span> TACTICAL ARCHIVE</div><div class="nav-links">';
        navLinks.forEach(function(pair) {
          var href = pair[0], label = pair[1];
          var adminStyle = (label === "Admin" || label === "Merits" || label === "Profile") ? "color:#fbbf24" : "";
          var active = href === "dashboard.html" ? "active" : "";
          nav += '<a href="' + href + '" class="' + active + '" style="' + adminStyle + '">' + label + '</a>';
        });
        nav += '</div><div class="nav-user"><div><div style="font-weight:600">' + esc(username) + '</div>';
        nav += '<div class="text-xs text-muted">Rank ' + rank + ' · ' + esc(role) + '</div></div>';
        nav += '<button class="btn-logout" type="button" id="btn-logout">Logout</button></div></div></nav>';

        var html = nav;
        html += '<div class="container">';
        html += '<div class="mb-6"><h1 style="font-size:1.45rem;">Welcome, ' + esc(username) + '</h1>';
        html += '<p class="text-muted text-sm">Rank level ' + rank + ' · ' + esc(role) + ' · shared live database</p></div>';

        html += '<div class="grid grid-2" style="gap:1rem;">';
        html += card("reports.html", "Reports", "Operational & classified", reports);
        html += card("voting.html", "Voting", "Unit subjects · Yes/No/Maybe", polls);
        html += card("training.html", "Training", "Materials by rank", training);
        html += card("tutorials.html", "Tutorials", "Video links", tutorials);
        html += card("tactical-centre.html", "Tactical Centre", "App links", links);
        if (isAdmin) html += card("merits.html", "Merits", "Awards (admin)", merits);
        html += '</div></div>';

        root.innerHTML = html;

        document.getElementById("btn-logout").onclick = async function() {
          await client.auth.signOut();
          window.location.href = "index.html";
        };

        // version stamp
        var stamp = document.createElement("div");
        stamp.style.cssText = "position:fixed;bottom:6px;right:8px;font-size:10px;color:#4a5a4a;z-index:99;";
        stamp.textContent = "build " + SITE_VERSION;
        document.body.appendChild(stamp);

      } catch (err) {
        root.innerHTML = '<div class="container"><div class="panel" style="margin-top:2rem;"><h2>Dashboard error</h2><p class="text-sm" style="color:#f87171;">' +
          esc(err.message || String(err)) + '</p><p class="text-sm text-muted mt-4">Check js/config.js anon key. <a href="index.html" style="color:#86efac;">Back to login</a></p></div></div>';
      }
    }

    function card(href, title, sub, count) {
      return '<a href="' + href + '" class="card" style="display:block;text-decoration:none;color:inherit;">' +
        '<h3>' + title + '</h3><p>' + sub + '</p>' +
        '<div class="count">' + count + '</div></a>';
    }

    main();
  </script>
</body>
</html>
