<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tactical Centre – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css?v=7" />
  <script src="js/data.js?v=7"></script>
  <script src="js/ranks-icons.js?v=7"></script>
</head>
<body>
  <script>renderNavbar("tactical-centre.html"); applyBackground();</script>

  <div class="container">
    <div class="mb-6">
      <h1 style="font-size:1.45rem;">Tactical Centre</h1>
      <p class="text-muted text-sm">Official web application and desktop client access</p>
    </div>
    <div id="list" class="card-grid"></div>

    <div class="panel mt-6" style="border-left:4px solid var(--accent);">
      <p class="text-sm text-muted">
        Always use the latest version. Report issues to your chain of command or site moderators.
      </p>
    </div>
  </div>

  <script>
    const session = requireAuth();
    if (!session) throw new Error("redirect");

    const links = getLinks().filter(l => l.is_active !== false);
    const list = document.getElementById("list");

    if (links.length === 0) {
      list.innerHTML = `
        <div class="panel text-center" style="padding:3rem;grid-column:1/-1;">
          <p class="text-muted">No active links configured.</p>
          <p class="text-xs text-muted mt-2">An admin can add them in the Admin panel.</p>
        </div>`;
    } else {
      list.innerHTML = links.map(link => `
        <div class="card">
          <h3>${esc(link.name)}</h3>
          <p class="text-xs text-muted">Version ${esc(link.version || "1.0")}</p>
          <p class="text-sm text-muted mt-2">${esc(link.description)}</p>
          <div class="mt-4 flex gap-2" style="flex-wrap:wrap;">
            ${link.web_url ? `<a href="${esc(link.web_url)}" target="_blank" class="btn btn-sm">Open Web Version</a>` : ''}
            ${link.desktop_url ? `<a href="${esc(link.desktop_url)}" target="_blank" class="btn btn-outline btn-sm">Download Desktop</a>` : ''}
          </div>
        </div>`).join("");
    }

    function esc(s) {
      if (!s) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
