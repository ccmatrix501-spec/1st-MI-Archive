<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ranks-icons.js"></script>
</head>
<body>
  <div id="app"><p class="text-muted text-center" style="padding:3rem;">Loading…</p></div>
  <script>
    function buildNav(session, companies, active) {
      var isAdmin = session.role === "admin";
      var links = [["dashboard.html","Dashboard"],["reports.html","Reports"],["voting.html","Voting"],["training.html","Training"],["tutorials.html","Tutorials"],["tactical-centre.html","Tactical Centre"],["profile.html","Profile"]];
      if (isAdmin) { links.push(["merits.html","Merits"]); links.push(["admin.html","Admin"]); }
      var h = '<nav class="navbar"><div class="nav-inner"><div class="nav-brand"><span>◆</span> TACTICAL ARCHIVE</div><div class="nav-links">';
      links.forEach(function(pair) {
        var gold = (pair[1]==="Admin"||pair[1]==="Merits") ? "color:#fbbf24" : "";
        h += '<a href="'+pair[0]+'" class="'+(pair[0]===active?"active":"")+'" style="'+gold+'">'+pair[1]+'</a>';
      });
      h += '</div><div class="nav-user"><div><div style="font-weight:600">'+esc(session.username)+'</div><div class="text-xs text-muted">'+formatRank(session.rank_level)+' · '+esc(companyName(companies||[], session.company_id))+'</div></div><button class="btn-logout" onclick="logout()">Logout</button></div></div></nav>';
      return h;
    }
    
    (async function() {
      initSupabase();
      var session = await requireAuth();
      if (!session) return;
      await applyBackground(); showVersion();
      var companies = await getCompanies();
      var id = new URLSearchParams(location.search).get("id");
      if (!id) { location.href = "reports.html"; return; }
      var res = await db().from("reports").select("*").eq("id", id).maybeSingle();
      var report = res.data;
      if (!report || !canSeeReport(report, session)) { location.href = "reports.html"; return; }
      var comments = await getComments(id);
      var html = buildNav(session, companies, "reports.html");
      html += '<div class="container"><p class="mb-4"><a href="reports.html" class="text-sm" style="color:#86efac;">← Back to reports</a></p>';
      html += '<div class="panel mb-4"><h1 style="font-size:1.35rem;margin-bottom:0.5rem;">'+esc(report.title)+'</h1>';
      html += '<div class="text-xs text-muted mb-4">'+formatRank(report.min_rank_level,14)+'+ · '+esc(companyName(companies, report.company_id));
      html += (report.is_classified?" · CLASSIFIED":"")+' · '+esc(report.author_name||"")+' · '+new Date(report.created_at).toLocaleString()+'</div>';
      html += '<div style="white-space:pre-wrap;line-height:1.6;">'+esc(report.body||"")+'</div>';
      var atts = report.attachments || [];
      if (atts.length) {
        html += '<div style="margin-top:1.25rem;border-top:1px solid var(--border);padding-top:1rem;"><h3 style="font-size:1rem;margin-bottom:0.6rem;">Report files</h3>';
        atts.forEach(function(a) {
          var isImg = (a.mime||"").indexOf("image/")===0 || /\.(png|jpe?g|gif|webp)$/i.test(a.name||"");
          if (isImg && a.url) html += '<div style="margin-bottom:0.75rem;"><img src="'+esc(a.url)+'" alt="'+esc(a.name||"")+'" style="max-width:100%;border-radius:8px;border:1px solid var(--border);" /><div class="text-xs text-muted">'+esc(a.name||"")+'</div></div>';
          else html += '<div style="margin-bottom:0.4rem;"><a href="'+esc(a.url)+'" target="_blank" rel="noopener" style="color:#86efac;">📎 '+esc(a.name||"Download")+'</a></div>';
        });
        html += '</div>';
      }
      html += '</div><div class="panel"><h2 style="font-size:1.05rem;margin-bottom:1rem;">Discussion</h2>';
      if (!comments.length) html += '<p class="text-muted text-sm mb-4">No comments yet.</p>';
      comments.forEach(function(c) {
        html += '<div style="padding:0.75rem 0;border-bottom:1px solid var(--border);"><strong>'+esc(c.username)+'</strong> <span class="text-xs text-muted">'+new Date(c.created_at).toLocaleString()+'</span><div class="text-sm mt-1">'+esc(c.body)+'</div></div>';
      });
      html += '<form id="cform" class="mt-4"><div class="form-group"><textarea id="cbody" class="textarea" required placeholder="Add a comment..."></textarea></div><button class="btn" type="submit">Post Comment</button></form></div></div>';
      document.getElementById("app").innerHTML = html;
      document.getElementById("cform").onsubmit = async function(e) {
        e.preventDefault();
        var body = document.getElementById("cbody").value.trim();
        if (!body) return;
        await addComment({ report_id: id, user_id: session.id, username: session.username, body: body });
        location.reload();
      };
    })();

  </script>
</body>
</html>
