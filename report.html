<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/data.js"></script>
  <script src="js/ranks-icons.js"></script>
</head>
<body>
  <script>renderNavbar("reports.html"); applyBackground();</script>

  <div class="container">
    <a href="reports.html" class="text-sm text-muted" style="display:inline-block;margin-bottom:1.2rem;">← Back to Reports</a>
    <div id="content"></div>

    <div class="panel mt-6" id="comments-box" style="display:none;">
      <h3 style="margin-bottom:1rem;">Discussion</h3>
      <div id="comments"></div>
      <form id="cform" class="mt-4 flex gap-2">
        <input type="text" id="cinput" class="input" placeholder="Add a comment..." required />
        <button type="submit" class="btn">Post</button>
      </form>
    </div>
  </div>

  <script>
    const session = requireAuth();
    if (!session) throw new Error("redirect");

    const id = new URLSearchParams(location.search).get("id");
    const reports = getReports();
    const report = reports.find(r => r.id === id);
    const box = document.getElementById("content");

    if (!report || report.status !== "published") {
      box.innerHTML = `<div class="panel text-center" style="padding:3rem;"><p class="text-muted">Report not found.</p></div>`;
    } else if (!canAccess(session.rank_level, report.min_rank_level)) {
      box.innerHTML = `
        <div class="panel text-center" style="padding:3rem;">
          <div style="font-size:2rem;margin-bottom:0.75rem;">🔒</div>
          <h3 style="margin-bottom:0.4rem;">Restricted Access</h3>
          <p class="text-muted text-sm">
            Requires <strong style="color:var(--warning);">${formatRank(report.min_rank_level)}</strong> or higher.<br>
            Your rank: ${formatRank(session.rank_level)}
          </p>
        </div>`;
    } else {
      const date = new Date(report.created_at).toLocaleString("en-GB", {
        day:"2-digit", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit"
      });

      box.innerHTML = `
        <article class="panel">
          <div class="flex gap-2" style="flex-wrap:wrap;margin-bottom:0.9rem;">
            ${report.is_classified ? '<span class="badge badge-classified">CLASSIFIED</span>' : ''}
            <span class="badge badge-rank rank-${report.min_rank_level}">${typeof rankIcon==="function"?rankIcon(report.min_rank_level,16):""} ${getRankName(report.min_rank_level)}+ required</span>
          </div>
          <h1 style="font-size:1.55rem;margin-bottom:0.6rem;">${esc(report.title)}</h1>
          <div class="text-sm text-muted" style="margin-bottom:1.4rem;padding-bottom:0.9rem;border-bottom:1px solid var(--border);">
            ${esc(report.author_name || "Unknown")} • ${date}
          </div>
          ${report.summary ? `
            <div class="panel" style="background:var(--bg);margin-bottom:1.4rem;">
              <div class="text-xs text-muted" style="text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.2rem;">Summary</div>
              <p>${esc(report.summary)}</p>
            </div>` : ''}
          <div style="white-space:pre-wrap;line-height:1.65;">${esc(report.content)}</div>
          ${report.file_url ? `
            <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border);">
              <a href="${esc(report.file_url)}" target="_blank" class="btn btn-sm">Open / Download Attachment</a>
            </div>` : ''}
        </article>`;

      document.getElementById("comments-box").style.display = "block";
      renderComments();
    }

    function renderComments() {
      const all = getComments().filter(c => c.parent_type === "report" && c.parent_id === id);
      const el = document.getElementById("comments");
      if (all.length === 0) {
        el.innerHTML = `<p class="text-muted text-sm text-center" style="padding:0.8rem 0;">No comments yet.</p>`;
        return;
      }
      el.innerHTML = all.map(c => {
        const t = new Date(c.created_at).toLocaleString("en-GB", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
        return `<div class="comment">
          <div class="comment-meta"><strong>${esc(c.author_name)}</strong> • ${t}</div>
          <div class="text-sm">${esc(c.content)}</div>
        </div>`;
      }).join("");
    }

    document.getElementById("cform").addEventListener("submit", e => {
      e.preventDefault();
      const input = document.getElementById("cinput");
      const content = input.value.trim();
      if (!content) return;

      const comments = getComments();
      comments.push({
        id: uid(),
        content,
        author_id: session.id,
        author_name: session.username,
        parent_type: "report",
        parent_id: id,
        created_at: new Date().toISOString()
      });
      saveComments(comments);
      input.value = "";
      renderComments();
    });

    function esc(s) {
      if (!s) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
