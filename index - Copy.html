<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tactical Archive – Login</title>
  <link rel="stylesheet" href="css/style.css?v=s2" />
  <style>
    .input { font-size: 16px !important; min-height: 44px; -webkit-appearance: none; border-radius: 8px; }
    .btn { min-height: 48px; font-size: 1rem; touch-action: manipulation; }
    .login-wrap { padding: 1rem; align-items: flex-start; padding-top: 8vh; }
    #status { text-align: center; font-size: 0.75rem; color: #6b7b6b; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-header">
        <div style="font-size:2.5rem;color:var(--accent);margin-bottom:0.5rem;">◆</div>
        <h1>TACTICAL ARCHIVE</h1>
        <p>Shared unit database · worldwide</p>
      </div>
      <div class="panel">
        <h2 class="text-center" style="font-size:1.1rem;margin-bottom:1.2rem;">Login</h2>
        <div id="alert" class="hidden"></div>
        <form id="auth-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" class="input" required autocomplete="username"
                   autocapitalize="none" autocorrect="off" spellcheck="false" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="input" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn w-full" id="submit-btn">Login</button>
        </form>
        <p class="text-center text-xs text-muted mt-4">Accounts are issued by unit leadership.</p>
        <div id="status">Connecting…</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=s2"></script>
  <script src="js/data.js?v=s2"></script>
  <script src="js/ranks-icons.js?v=s2"></script>
  <script>
    try { showVersion(); } catch (e) {}
    var alertBox = document.getElementById("alert");
    var btn = document.getElementById("submit-btn");
    var status = document.getElementById("status");

    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.className = "alert alert-error";
      alertBox.classList.remove("hidden");
    }

    (async function init() {
      if (!window.TA_CONFIG || String(window.TA_CONFIG.SUPABASE_ANON_KEY).indexOf("PASTE_") === 0) {
        status.textContent = "Config missing — edit js/config.js with your anon key";
        status.style.color = "#f87171";
        return;
      }
      initSupabase();
      status.textContent = "Connected · build " + (window.SITE_VERSION || "");
      status.style.color = "#86efac";
      var user = await loadSession();
      if (user) window.location.replace("dashboard.html");
    })();

    document.getElementById("auth-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      alertBox.classList.add("hidden");
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;
      if (!username || !password) { showError("Enter username and password."); return; }
      btn.disabled = true;
      btn.textContent = "Please wait...";
      var result = await login(username, password);
      if (result.error) {
        showError(result.error);
        btn.disabled = false;
        btn.textContent = "Login";
        return;
      }
      window.location.replace("dashboard.html");
    });
  </script>
</body>
</html>
