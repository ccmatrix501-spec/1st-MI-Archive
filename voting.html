<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voting – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css?v=s2" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=s2"></script>
  <script src="js/data.js?v=s2"></script>
  <script src="js/ranks-icons.js?v=s2"></script>
</head>
<body>
  <div id="app"><p class="text-muted text-center" style="padding:3rem;">Loading…</p></div>
  <script>
    function optionColor(label) {
      const t = String(label).toLowerCase();
      if (t === "yes") return "#166534";
      if (t === "no") return "#7f1d1d";
      if (t === "maybe") return "#854d0e";
      return "#274d27";
    }

    let session = null;
    let isLeader = false;

    async function render() {
      const polls = await getPolls();
      const allVotes = await getVotes();
      let html = '';
      html += '<nav class="navbar"><div class="nav-inner"><div class="nav-brand"><span>◆</span> TACTICAL ARCHIVE</div><div class="nav-links">';
      const links = [["dashboard.html","Dashboard"],["reports.html","Reports"],["voting.html","Voting"],["training.html","Training"],["tutorials.html","Tutorials"],["tactical-centre.html","Tactical Centre"]];
      if (session.role === "admin") links.push(["merits.html","Merits"],["admin.html","Admin"],["profile.html","Profile"]);
      links.forEach(([h,l]) => { html += '<a href="'+h+'" class="'+(h==="voting.html"?"active":"")+'" style="'+(l==="Admin"||l==="Merits"||l==="Profile"?"color:#fbbf24":"")+'">'+l+'</a>'; });
      html += '</div><div class="nav-user"><div><div style="font-weight:600">'+esc(session.username)+'</div><div>'+formatRank(session.rank_level)+' · '+session.role+'</div></div><button class="btn-logout" onclick="logout()">Logout</button></div></div></nav>';
      html += '<div class="container"><div class="mb-6"><h1 style="font-size:1.45rem;">Unit Voting</h1><p class="text-muted text-sm">Yes / No / Maybe · shared live</p></div>';

      if (isLeader) {
        html += `<div class="panel mb-6">
          <h2 style="font-size:1.1rem;margin-bottom:1rem;">Create Vote Subject</h2>
          <div id="create-alert" class="hidden"></div>
          <form id="poll-form">
            <div class="form-group"><label>Subject</label><input type="text" id="poll-title" class="input" required /></div>
            <div class="form-group"><label>Description</label><textarea id="poll-desc" class="textarea"></textarea></div>
            <div class="form-group"><label>Options</label><textarea id="poll-options" class="textarea" required>Yes
No
Maybe</textarea></div>
            <label style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem;"><input type="checkbox" id="poll-active" checked /> Open immediately</label>
            <button type="submit" class="btn">Post Subject</button>
          </form>
        </div>`;
      }

      if (!polls.length) {
        html += '<div class="panel text-center" style="padding:3rem;"><p class="text-muted">No subjects yet.</p></div>';
      } else {
        for (const p of polls) {
          const votes = allVotes.filter(v => v.poll_id === p.id);
          const myVote = votes.find(v => v.user_id === session.id);
          const total = votes.length;
          const closed = !p.active;
          html += '<div class="panel mb-4"><div class="flex justify-between items-center" style="flex-wrap:wrap;gap:0.5rem;margin-bottom:0.5rem;"><h3 style="font-size:1.15rem;">'+esc(p.title)+'</h3><span class="badge">'+(p.active?"OPEN":"CLOSED")+'</span></div>';
          if (p.description) html += '<p class="text-sm text-muted mb-4">'+esc(p.description)+'</p>';
          html += '<div class="text-xs text-muted mb-4">Posted by '+esc(p.author_name)+' · '+total+' votes'+(myVote?' · You voted <strong>'+esc(p.options[myVote.option_index])+'</strong>':'')+'</div>';
          (p.options || []).forEach((opt, i) => {
            const count = votes.filter(v => v.option_index === i).length;
            const pct = total ? Math.round(count/total*100) : 0;
            const color = optionColor(opt);
            if (myVote || closed || isLeader) {
              html += '<div style="margin-bottom:0.65rem;"><div class="flex justify-between text-sm"><span><strong>'+esc(opt)+'</strong></span><span class="text-muted">'+count+' · '+pct+'%</span></div><div style="height:10px;background:var(--bg);border-radius:4px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+color+';"></div></div></div>';
            } else {
              html += '<button type="button" class="btn w-full" style="margin-bottom:0.5rem;background:'+color+';min-height:48px;" onclick="doVote(\''+p.id+'\','+i+')">'+esc(opt)+'</button>';
            }
          });
          if (isLeader) {
            html += '<div class="flex gap-2 mt-4"><button class="btn btn-sm btn-outline" onclick="togglePoll(\''+p.id+'\','+(!p.active)+')">'+(p.active?'Close':'Reopen')+'</button><button class="btn btn-sm btn-danger" onclick="removePoll(\''+p.id+'\')">Delete</button></div>';
          }
          html += '</div>';
        }
      }
      html += '</div>';
      document.getElementById("app").innerHTML = html;

      const form = document.getElementById("poll-form");
      if (form) {
        form.addEventListener("submit", async function(e) {
          e.preventDefault();
          const title = document.getElementById("poll-title").value.trim();
          const description = document.getElementById("poll-desc").value.trim();
          const options = document.getElementById("poll-options").value.split("\n").map(s=>s.trim()).filter(Boolean);
          const active = document.getElementById("poll-active").checked;
          if (options.length < 2) { alert("Need at least 2 options"); return; }
          await savePoll({
            title, description: description || null, options, active,
            author_id: session.id, author_name: session.username
          });
          await render();
        });
      }
    }

    async function doVote(pollId, optionIndex) {
      const r = await castVote({
        poll_id: pollId, user_id: session.id, username: session.username, option_index: optionIndex
      });
      if (!r.ok) alert(r.error || "Could not vote");
      await render();
    }
    async function togglePoll(id, active) {
      await savePoll({ id, active });
      await render();
    }
    async function removePoll(id) {
      if (!confirm("Delete this subject?")) return;
      await deletePoll(id);
      await render();
    }

    (async function() {
      initSupabase();
      session = await requireAuth();
      if (!session) return;
      isLeader = session.role === "admin" || session.role === "moderator";
      await applyBackground();
      showVersion();
      await render();
    })();
  </script>
</body>
</html>
