<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voting – Tactical Archive</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ranks-icons.js"></script>
</head>
<body>
  <div id="app"><p class="text-muted text-center" style="padding:3rem;">Loading…</p></div>
  <script>
    function buildNav(session, companies, active) {
      var isAdmin = session.role === "admin";
      var links = [["dashboard.html","Dashboard"],["reports.html","Reports"],["voting.html","Voting"],["training.html","Training"],["tutorials.html","Tutorials"],["tactical-centre.html","Tactical Centre"],["profile.html","Profile"]];
      if (isAdmin) { links.push(["merits.html","Merits"]); links.push(["admin.html","Admin"]); }
      var h = '<nav class="navbar"><div class="nav-inner"><div class="nav-brand"><span>◆</span> TACTICAL ARCHIVE</div><div class="nav-links">';
      links.forEach(function(pair) {
        var gold = (pair[1]==="Admin"||pair[1]==="Merits") ? "color:#fbbf24" : "";
        h += '<a href="'+pair[0]+'" class="'+(pair[0]===active?"active":"")+'" style="'+gold+'">'+pair[1]+'</a>';
      });
      h += '</div><div class="nav-user"><div><div style="font-weight:600">'+esc(session.username)+'</div><div class="text-xs text-muted">'+formatRank(session.rank_level)+' · '+esc(companyName(companies||[], session.company_id))+'</div></div><button class="btn-logout" onclick="logout()">Logout</button></div></div></nav>';
      return h;
    }
    
    function optionColor(label) {
      var t = String(label).toLowerCase();
      if (t === "yes") return "#166534";
      if (t === "no") return "#7f1d1d";
      if (t === "maybe") return "#854d0e";
      return "#274d27";
    }
    var session = null, companies = [], isLeader = false;
    async function render() {
      var polls = (await getPolls()).filter(function(p){ return canSeePoll(p, session); });
      var allVotes = await getVotes();
      var html = buildNav(session, companies, "voting.html");
      html += '<div class="container"><div class="mb-6"><h1 style="font-size:1.45rem;">Unit Voting</h1><p class="text-muted text-sm">Yes / No / Maybe · rank & company gated</p></div>';
      if (isLeader) {
        html += '<div class="panel mb-6"><h2 style="font-size:1.1rem;margin-bottom:1rem;">Create Vote Subject</h2>';
        html += '<form id="poll-form">';
        html += '<div class="form-group"><label>Subject</label><input type="text" id="poll-title" class="input" required /></div>';
        html += '<div class="form-group"><label>Description</label><textarea id="poll-desc" class="textarea"></textarea></div>';
        html += '<div class="form-group"><label>Options (one per line)</label><textarea id="poll-options" class="textarea" required>Yes\nNo\nMaybe</textarea></div>';
        html += '<div class="form-group"><label>Min Rank to see & vote</label><select id="poll-rank" class="select">'+rankOptions(1)+'</select></div>';
        html += '<div class="form-group"><label>Company</label><select id="poll-company" class="select">'+buildCompanyOptions(companies, "", true)+'</select></div>';
        html += '<label style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem;"><input type="checkbox" id="poll-active" checked /> Open immediately</label>';
        html += '<button type="submit" class="btn">Post Subject</button></form></div>';
      }
      if (!polls.length) html += '<div class="panel text-center" style="padding:3rem;"><p class="text-muted">No subjects available for your rank/company.</p></div>';
      else polls.forEach(function(p) {
        var votes = allVotes.filter(function(v){ return v.poll_id === p.id; });
        var myVote = votes.find(function(v){ return v.user_id === session.id; });
        var total = votes.length;
        html += '<div class="panel mb-4"><div class="flex justify-between items-center" style="flex-wrap:wrap;gap:0.5rem;margin-bottom:0.5rem;">';
        html += '<h3 style="font-size:1.15rem;">'+esc(p.title)+'</h3><span class="badge">'+(p.active?"OPEN":"CLOSED")+'</span></div>';
        html += '<div class="text-xs text-muted mb-2">'+formatRank(p.min_rank_level||1,14)+'+ · '+esc(companyName(companies, p.company_id));
        html += ' · '+esc(p.author_name||"")+' · '+total+' votes';
        if (myVote) html += ' · You voted <strong>'+esc((p.options||[])[myVote.option_index])+'</strong>';
        html += '</div>';
        if (p.description) html += '<p class="text-sm text-muted mb-4">'+esc(p.description)+'</p>';
        (p.options||[]).forEach(function(opt, i) {
          var count = votes.filter(function(v){ return v.option_index === i; }).length;
          var pct = total ? Math.round(count/total*100) : 0;
          var color = optionColor(opt);
          // Leaders (admin/moderator) can vote too — only hide buttons after they vote or poll closes
          if (myVote || !p.active) {
            html += '<div style="margin-bottom:0.65rem;"><div class="flex justify-between text-sm"><span><strong>'+esc(opt)+'</strong></span><span class="text-muted">'+count+' · '+pct+'%</span></div>';
            html += '<div style="height:10px;background:var(--bg);border-radius:4px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+color+';"></div></div></div>';
          } else {
            html += '<button type="button" class="btn w-full" style="margin-bottom:0.5rem;background:'+color+';min-height:48px;" data-vote="'+p.id+'" data-opt="'+i+'">'+esc(opt)+'</button>';
          }
        });
        if (isLeader) {
          html += '<div class="flex gap-2 mt-4"><button class="btn btn-sm btn-outline" data-toggle="'+p.id+'" data-active="'+(!p.active)+'">'+(p.active?'Close':'Reopen')+'</button>';
          html += '<button class="btn btn-sm btn-danger" data-del="'+p.id+'">Delete</button></div>';
        }
        html += '</div>';
      });
      html += '</div>';
      document.getElementById("app").innerHTML = html;
      var form = document.getElementById("poll-form");
      if (form) form.onsubmit = async function(e) {
        e.preventDefault();
        var options = document.getElementById("poll-options").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
        if (options.length < 2) { alert("Need at least 2 options"); return; }
        await savePoll({
          title: document.getElementById("poll-title").value.trim(),
          description: document.getElementById("poll-desc").value.trim() || null,
          options: options, active: document.getElementById("poll-active").checked,
          min_rank_level: Number(document.getElementById("poll-rank").value)||1,
          company_id: document.getElementById("poll-company").value || null,
          author_id: session.id, author_name: session.username
        });
        await render();
      };
      document.querySelectorAll("[data-vote]").forEach(function(btn) {
        btn.onclick = async function() {
          var r = await castVote({ poll_id: btn.getAttribute("data-vote"), user_id: session.id, username: session.username, option_index: Number(btn.getAttribute("data-opt")) });
          if (!r.ok) alert(r.error || "Could not vote");
          await render();
        };
      });
      document.querySelectorAll("[data-toggle]").forEach(function(btn) {
        btn.onclick = async function() { await savePoll({ id: btn.getAttribute("data-toggle"), active: btn.getAttribute("data-active")==="true" }); await render(); };
      });
      document.querySelectorAll("[data-del]").forEach(function(btn) {
        btn.onclick = async function() { if (!confirm("Delete?")) return; await deletePoll(btn.getAttribute("data-del")); await render(); };
      });
    }
    (async function() {
      initSupabase();
      session = await requireAuth();
      if (!session) return;
      isLeader = session.role === "admin" || session.role === "moderator";
      companies = await getCompanies();
      await applyBackground(); showVersion();
      await render();
    })();

  </script>
</body>
</html>
